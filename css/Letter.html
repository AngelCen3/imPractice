<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Properties</title>
    <style>
        /* Estilos para el cuerpo y fondo */
        body {
            margin: 0;
            padding: 0;
            /* Añade tu imagen de fondo aquí */
            background-image: url('ruta/de/tu/imagen.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* Contenedor principal */
        .main-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Altura total de la ventana */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Estilos comunes para los títulos */
        .main-container h1 {
            position: absolute;
            margin: 0;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }
        /* Estilos específicos para cada palabra */
        .letter-1 {
            color: brown;
            font-size: 60px;
            top: 10%;
            left: 10%;
        }
        .letter-2 {
            color: chocolate;
            font-size: 80px;
            top: 30%;
            left: 50%;
            transform: rotate(-10deg);
        }
        .letter-3 {
            color: burlywood;
            font-size: 50px;
            top: 50%;
            left: 20%;
            transform: rotate(15deg);
        }
        .letter-4 {
            color: coral;
            font-size: 70px;
            top: 65%;
            left: 60%;
            transform: rotate(-5deg);
        }
        .letter-5{
            color: brown;
            font-size: 90px;
            top: 80%;
            left: 30%;
            transform: rotate(10deg);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="letter-1">Haz</h1>
        <h1 class="letter-2">Pensado</h1>
        <h1 class="letter-3">En Revolucionar</h1>
        <h1 class="letter-4">Las Conciencias</h1>
        <h1 class="letter-5">Metrou Te Ayuda</h1>
    </div>
</body>
</html>

</html>
